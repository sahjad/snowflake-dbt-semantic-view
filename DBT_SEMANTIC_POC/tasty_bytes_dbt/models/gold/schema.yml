version: 2

# ==============================================================================
# Model contracts (contract.enforced: true) for every Gold table.
#
# Three things worth knowing before editing this file:
#
# 1. A contract is all-or-nothing per model -- every column must be listed
#    with its EXACT Snowflake data_type, not just the ones involved in a
#    constraint. If a model's compiled SELECT ever produces a different type
#    than what's declared here, the ENTIRE model build fails (not a partial
#    failure). Every computed/derived column in the corresponding .sql files
#    has an explicit CAST for exactly this reason -- so its type is
#    deterministic and guaranteed to match what's declared here, rather than
#    relying on whatever Snowflake happens to infer from a function call or
#    a string concatenation.
#
# 2. primary_key / foreign_key / unique constraints are STILL metadata-only
#    on Snowflake -- same as the hand-written SEMANTIC_TOOL schema elsewhere
#    in this project. Declaring them here does not make Snowflake reject a
#    duplicate or an orphaned row; it's documentation, RELY-based optimizer
#    hints, and discoverability for tools that read constraint metadata
#    (including this project's own suggest_primary_key()/
#    suggest_relationships() in the Business User App). The `tests:` blocks
#    below are what actually check anything -- `unique`, `not_null`, and
#    `relationships` compile to real SELECT queries dbt runs on every
#    `dbt build`/`dbt test`, and genuinely fail if violated. (not_null is
#    the one exception -- Snowflake does enforce that one at the engine
#    level regardless of dbt; declaring it both as a constraint and a test
#    is slightly redundant but costs nothing.)
#
# 3. Foreign-key constraint syntax below (`to:` / `to_columns:`) requires
#    dbt-core 1.9+. If the new account's dbt version is older, swap for the
#    earlier `expression: "..."` form instead.
# ==============================================================================

models:

  # ----------------------------------------------------------------------
  # EXISTING -- dim_menu
  # ----------------------------------------------------------------------
  - name: dim_menu
    config:
      contract:
        enforced: true
    columns:
      - name: menu_item_id
        data_type: number(38,0)
        constraints:
          - type: primary_key
        tests:
          - unique
          - not_null
      - name: menu_type
        data_type: varchar(16777216)
      - name: truck_brand_name
        data_type: varchar(16777216)
      - name: menu_item_name
        data_type: varchar(16777216)
      - name: item_category
        data_type: varchar(16777216)
      - name: item_subcategory
        data_type: varchar(16777216)
      - name: cost_of_goods_usd
        data_type: number(38,4)
      - name: sale_price_usd
        data_type: number(38,4)

  # ----------------------------------------------------------------------
  # EXISTING -- dim_truck
  # ----------------------------------------------------------------------
  - name: dim_truck
    config:
      contract:
        enforced: true
    columns:
      - name: truck_id
        data_type: number(38,0)
        constraints:
          - type: primary_key
        tests:
          - unique
          - not_null
      - name: primary_city
        data_type: varchar(16777216)
      - name: region
        data_type: varchar(16777216)
      - name: country
        data_type: varchar(16777216)
      - name: year
        data_type: number(38,0)
      - name: make
        data_type: varchar(16777216)
      - name: model
        data_type: varchar(16777216)
      - name: ev_flag
        data_type: number(38,0)
      - name: franchise_id
        data_type: number(38,0)
        constraints:
          - type: foreign_key
            to: ref('dim_franchise')
            to_columns: [franchise_id]
        tests:
          - relationships:
              to: ref('dim_franchise')
              field: franchise_id
      - name: truck_opening_date
        data_type: date

  # ----------------------------------------------------------------------
  # EXISTING -- dim_location
  # ----------------------------------------------------------------------
  - name: dim_location
    config:
      contract:
        enforced: true
    columns:
      - name: location_id
        data_type: number(19,0)
        constraints:
          - type: primary_key
        tests:
          - unique
          - not_null
      - name: location
        data_type: varchar(16777216)
      - name: city
        data_type: varchar(16777216)
      - name: region
        data_type: varchar(16777216)
      - name: country
        data_type: varchar(16777216)

  # ----------------------------------------------------------------------
  # EXISTING -- dim_customer_loyalty
  # ----------------------------------------------------------------------
  - name: dim_customer_loyalty
    config:
      contract:
        enforced: true
    columns:
      - name: customer_id
        data_type: number(38,0)
        constraints:
          - type: primary_key
        tests:
          - unique
          - not_null
      - name: first_name
        data_type: varchar(16777216)
      - name: last_name
        data_type: varchar(16777216)
      - name: city
        data_type: varchar(16777216)
      - name: country
        data_type: varchar(16777216)
      - name: preferred_language
        data_type: varchar(16777216)
      - name: favourite_brand
        data_type: varchar(16777216)
      - name: marital_status
        data_type: varchar(16777216)
      - name: sign_up_date
        data_type: date

  # ----------------------------------------------------------------------
  # NEW -- dim_franchise. Fixes the dangling FK: dim_truck.franchise_id has
  # pointed at nothing since raw.franchise was loaded in Step 1 and never
  # referenced again until now.
  # ----------------------------------------------------------------------
  - name: dim_franchise
    config:
      contract:
        enforced: true
    columns:
      - name: franchise_id
        data_type: number(38,0)
        constraints:
          - type: primary_key
        tests:
          - unique
          - not_null
      - name: first_name
        data_type: varchar(16777216)
      - name: last_name
        data_type: varchar(16777216)
      - name: franchise_owner_name
        data_type: varchar(16777216)
      - name: franchise_home_city
        data_type: varchar(16777216)
      - name: franchise_home_country
        data_type: varchar(16777216)
      - name: e_mail
        data_type: varchar(16777216)
      - name: phone_number
        data_type: varchar(16777216)

  # ----------------------------------------------------------------------
  # NEW -- dim_date. Calendar dimension, generated natively (no dbt_utils).
  # ----------------------------------------------------------------------
  - name: dim_date
    config:
      contract:
        enforced: true
    columns:
      - name: date_day
        data_type: date
        constraints:
          - type: primary_key
        tests:
          - unique
          - not_null
      - name: year
        data_type: number(4,0)
      - name: quarter
        data_type: number(1,0)
      - name: month
        data_type: number(2,0)
      - name: month_name
        data_type: varchar(3)
      - name: week_of_year
        data_type: number(2,0)
      - name: day_of_week
        data_type: number(1,0)
      - name: day_name
        data_type: varchar(3)
      - name: day_of_month
        data_type: number(2,0)
      - name: day_of_year
        data_type: number(3,0)
      - name: is_weekend
        data_type: boolean

  # ----------------------------------------------------------------------
  # NEW -- dim_menu_item_health_metrics. Structure verified against live
  # data (menu_item_id 10-14 sampled from raw.menu) -- flags are 'Y'/'N' in
  # the source and normalized to real BOOLEAN in the model's SELECT via
  # `= 'Y'`, which is why the contract declares boolean here rather than
  # varchar. Kept separate from dim_menu so it stays cheap to adjust in
  # isolation if a future reload ever shows a different shape.
  # ----------------------------------------------------------------------
  - name: dim_menu_item_health_metrics
    config:
      contract:
        enforced: true
    columns:
      - name: menu_item_id
        data_type: number(38,0)
        constraints:
          - type: primary_key
          - type: foreign_key
            to: ref('dim_menu')
            to_columns: [menu_item_id]
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('dim_menu')
              field: menu_item_id
      - name: is_dairy_free_flag
        data_type: boolean
      - name: is_gluten_free_flag
        data_type: boolean
      - name: is_healthy_flag
        data_type: boolean
      - name: is_nut_free_flag
        data_type: boolean
      - name: ingredients
        data_type: variant

  # ----------------------------------------------------------------------
  # NEW -- bridge_menu_item_ingredient. Structure verified alongside the
  # above -- ingredients is confirmed to be a flat array of strings.
  # Composite grain, so the primary key is declared at the model level
  # instead of on a single column.
  # ----------------------------------------------------------------------
  - name: bridge_menu_item_ingredient
    config:
      contract:
        enforced: true
    constraints:
      - type: primary_key
        columns: [menu_item_id, ingredient_name]
    columns:
      - name: menu_item_id
        data_type: number(38,0)
        constraints:
          - type: foreign_key
            to: ref('dim_menu')
            to_columns: [menu_item_id]
        tests:
          - not_null
          - relationships:
              to: ref('dim_menu')
              field: menu_item_id
      - name: ingredient_name
        data_type: varchar(16777216)
        tests:
          - not_null

  # ----------------------------------------------------------------------
  # EXISTING -- fct_order_detail (line-item grain)
  # ----------------------------------------------------------------------
  - name: fct_order_detail
    config:
      contract:
        enforced: true
    columns:
      - name: order_detail_id
        data_type: number(38,0)
        constraints:
          - type: primary_key
        tests:
          - unique
          - not_null
      - name: order_id
        data_type: number(38,0)
        tests:
          - not_null
      - name: order_ts
        data_type: timestamp_ntz(9)
      - name: order_channel
        data_type: varchar(16777216)
      - name: truck_id
        data_type: number(38,0)
        constraints:
          - type: foreign_key
            to: ref('dim_truck')
            to_columns: [truck_id]
        tests:
          - relationships:
              to: ref('dim_truck')
              field: truck_id
      - name: location_id
        data_type: number(19,0)
        constraints:
          - type: foreign_key
            to: ref('dim_location')
            to_columns: [location_id]
        tests:
          - relationships:
              to: ref('dim_location')
              field: location_id
      - name: customer_id
        data_type: number(38,0)
        constraints:
          - type: foreign_key
            to: ref('dim_customer_loyalty')
            to_columns: [customer_id]
        tests:
          - relationships:
              to: ref('dim_customer_loyalty')
              field: customer_id
      - name: menu_item_id
        data_type: number(38,0)
        constraints:
          - type: foreign_key
            to: ref('dim_menu')
            to_columns: [menu_item_id]
        tests:
          - relationships:
              to: ref('dim_menu')
              field: menu_item_id
      - name: line_number
        data_type: number(38,0)
      - name: quantity
        data_type: number(5,0)
      - name: unit_price
        data_type: number(38,4)
      - name: line_total
        data_type: number(38,4)

  # ----------------------------------------------------------------------
  # NEW -- fct_order_header (order grain, complementary to fct_order_detail)
  # ----------------------------------------------------------------------
  - name: fct_order_header
    config:
      contract:
        enforced: true
    columns:
      - name: order_id
        data_type: number(38,0)
        constraints:
          - type: primary_key
        tests:
          - unique
          - not_null
      - name: truck_id
        data_type: number(38,0)
        constraints:
          - type: foreign_key
            to: ref('dim_truck')
            to_columns: [truck_id]
        tests:
          - relationships:
              to: ref('dim_truck')
              field: truck_id
      - name: location_id
        data_type: number(19,0)
        constraints:
          - type: foreign_key
            to: ref('dim_location')
            to_columns: [location_id]
        tests:
          - relationships:
              to: ref('dim_location')
              field: location_id
      - name: customer_id
        data_type: number(38,0)
        constraints:
          - type: foreign_key
            to: ref('dim_customer_loyalty')
            to_columns: [customer_id]
        tests:
          - relationships:
              to: ref('dim_customer_loyalty')
              field: customer_id
      - name: order_date
        data_type: date
        constraints:
          - type: foreign_key
            to: ref('dim_date')
            to_columns: [date_day]
        tests:
          - relationships:
              to: ref('dim_date')
              field: date_day
      - name: order_ts
        data_type: timestamp_ntz(9)
      - name: order_channel
        data_type: varchar(16777216)
      - name: order_currency
        data_type: varchar(3)
      - name: discount_id
        data_type: varchar(16777216)
      - name: shift_id
        data_type: number(38,0)
      - name: shift_start_time
        data_type: time(9)
      - name: shift_end_time
        data_type: time(9)
      - name: served_ts
        data_type: timestamp_ntz(9)
      - name: order_amount
        data_type: number(38,4)
      - name: order_tax_amount
        data_type: number(38,4)
      - name: order_discount_amount
        data_type: number(38,4)
      - name: order_total
        data_type: number(38,4)
