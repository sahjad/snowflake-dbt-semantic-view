definition_version: 2
entities:
  streamlit_app:
    type: streamlit
    main_file: streamlit_app.py
    artifacts:
      - pyproject.toml
      - streamlit_app.py
      - .streamlit/config.toml
    identifier:
      database: LINEAGE_APP_DB
      schema: APPS
      name: SNOWFLAKE_LINEAGE_EXPLORER
    title: snowflake_lineage_explorer
    query_warehouse: LINEAGE_APP_WH
    compute_pool: SYSTEM_COMPUTE_POOL_CPU
    run_mode: SpcsOnly
    execute_as: OWNER
    artifact_repositories:
      - SNOWFLAKE.SNOWPARK.PYPI_SHARED_REPOSITORY
    sharing:
      - role: LINEAGE_APP_ROLE
        with_grant_option: true
      - role: ACCOUNTADMIN
        with_grant_option: true
